
name: DriveSchool OS - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for candidate in \
            "driveschool-os.zip" \
            "DriveSchool-OS-starter.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found in repository root."
            echo "Upload driveschool-os.zip to the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ]; then
            PROJECT_DIR="extracted"
          else
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find extracted -mindepth 2 -maxdepth 5 \
                -name package.json \
                -not -path '*/node_modules/*' \
                -print | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No package.json found inside ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::Invalid project directory."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Configure GitHub Pages base path
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const candidates = [
            'vite.config.ts',
            'vite.config.js',
            'vite.config.mts',
            'vite.config.mjs'
          ];

          const config = candidates.find(
            (file) => fs.existsSync(file)
          );

          if (!config) {
            console.log(
              'No Vite config found; base path was not modified.'
            );
            process.exit(0);
          }

          const repo = process.env.REPOSITORY;
          const owner = process.env.OWNER;
          const base = repo === `${owner}.github.io`
            ? '/'
            : `/${repo}/`;

          let source = fs.readFileSync(config, 'utf8');

          if (/\bbase\s*:/.test(source)) {
            source = source.replace(
              /\bbase\s*:\s*(['"])[^'"]*\1/,
              `base: '${base}'`
            );
          } else {
            source = source.replace(
              /defineConfig\s*\(\s*\{/,
              (match) => `${match}\n  base: '${base}',`
            );
          }

          fs.writeFileSync(config, source);
          console.log(`Configured Vite base: ${base}`);
          NODE

      - name: Build production app
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify build output
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not generated."
            exit 1
          fi

          echo "Build verification successful."
          du -sh dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.project_dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
