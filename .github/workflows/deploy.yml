
name: DriveSchool OS - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate and extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          PROJECT_DIR=""

          # Find a ZIP if one exists in the repository root.
          ZIP_FILE=""

          for candidate in \
            driveschool-os.zip \
            driveschool-os-updated.zip \
            DriveSchool-OS-starter.zip
          do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d extracted

            if [ -f extracted/package.json ]; then
              PROJECT_DIR="extracted"
            else
              while IFS= read -r file; do
                PROJECT_DIR="$(dirname "$file")"
                break
              done < <(
                find extracted -mindepth 2 -maxdepth 5 \
                  -name package.json \
                  -not -path '*/node_modules/*' \
                  -print | sort
              )
            fi
          fi

          # Otherwise, use the project already in the repository.
          if [ -z "$PROJECT_DIR" ] && [ -f package.json ]; then
            PROJECT_DIR="."
          fi

          # Or locate package.json in an existing project folder.
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find . -mindepth 2 -maxdepth 4 \
                -name package.json \
                -not -path '*/node_modules/*' \
                -not -path './.git/*' \
                -not -path './extracted/*' \
                -print | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Cannot find package.json or a project ZIP."
            echo "Upload the ZIP or commit the project files."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json is missing."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT_DIR"
          cat "$PROJECT_DIR/package.json"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Configure Vite for GitHub Pages
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const files = [
            'vite.config.ts',
            'vite.config.js',
            'vite.config.mts',
            'vite.config.mjs'
          ];

          const file = files.find(f => fs.existsSync(f));

          if (!file) {
            console.log('No Vite config found; skipping base update.');
            process.exit(0);
          }

          let source = fs.readFileSync(file, 'utf8');

          const base =
            process.env.REPOSITORY ===
            `${process.env.OWNER}.github.io`
              ? '/'
              : `/${process.env.REPOSITORY}/`;

          if (/\bbase\s*:/.test(source)) {
            source = source.replace(
              /\bbase\s*:\s*(['"])[^'"]*\1/,
              `base: '${base}'`
            );
          } else if (/defineConfig\s*\(\s*\{/.test(source)) {
            source = source.replace(
              /defineConfig\s*\(\s*\{/,
              match => `${match}\n  base: '${base}',`
            );
          } else {
            console.log(
              'Review Vite base configuration manually.'
            );
          }

          fs.writeFileSync(file, source);
          console.log(`Vite base path: ${base}`);
          NODE

      - name: Build application
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run build

      - name: Verify build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ ! -s dist/index.html ]; then
            echo "::error::Build failed: dist/index.html is missing."
            exit 1
          fi

          echo "Build output verified."
          du -sh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.project_dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
